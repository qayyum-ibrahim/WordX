<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#14102b;font-family:Inter,system-ui,sans-serif;color:#fff}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(160deg,#14102b 0%,#251a55 55%,#3a1f7a 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5}
.abs{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform,opacity}
.logo{font-weight:900;letter-spacing:-4px;text-align:center;line-height:1}
.logo span{color:#ffc928}
#tag{font-size:50px;font-weight:600;color:#cfc7ff;text-align:center;width:1080px}
#card{left:70px;width:940px;top:290px;height:1190px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:56px;padding:48px}
.lab{font-size:34px;font-weight:700;letter-spacing:4px;color:#a79fd0}
#pts{position:absolute;right:48px;top:20px;text-align:center}
#pts b{display:block;font-size:130px;font-weight:900;line-height:1;color:#ffc928}
#pts i{font-style:normal;font-size:28px;font-weight:700;color:#a79fd0;letter-spacing:3px}
.clue{position:absolute;left:48px;width:844px;height:106px;border-radius:28px;background:rgba(255,255,255,.1);display:flex;align-items:center;padding:0 34px;font-size:48px;font-weight:700}
.clue .n{width:62px;height:62px;border-radius:50%;background:#7c4dff;display:flex;align-items:center;justify-content:center;font-size:34px;margin-right:28px;flex:none}
.clue.hid{background:rgba(255,255,255,.04);color:#6f68a0}
.clue.hid .n{background:rgba(255,255,255,.1);color:#8b84bd}
.boxes{position:absolute;left:48px;width:844px;top:810px;display:flex;gap:18px;justify-content:center}
.box{width:130px;height:150px;border-radius:26px;background:rgba(0,0,0,.28);border:3px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:92px;font-weight:900}
#inp{position:absolute;left:48px;top:1000px;width:844px;height:120px;border-radius:64px;background:rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.18);display:flex;align-items:center;padding:0 48px;font-size:62px;font-weight:800;letter-spacing:6px}
#plus{font-size:120px;font-weight:900;color:#4ade80;text-align:center;width:1080px}
.chip{position:absolute;left:150px;width:780px;height:120px;border-radius:60px;background:rgba(255,255,255,.1);display:flex;align-items:center;padding:0 40px;font-size:48px;font-weight:700}
.chip em{margin-left:auto;font-style:normal;color:#ffc928;font-weight:900}
.av{width:72px;height:72px;border-radius:50%;margin-right:26px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900}
#code{width:520px;margin-left:280px;text-align:center;background:#ffc928;color:#14102b;font-size:110px;font-weight:900;letter-spacing:18px;border-radius:40px;padding:18px 0 18px 18px}
#btn{width:760px;height:190px;margin-left:160px;border-radius:95px;background:linear-gradient(135deg,#8b5cf6,#6d3df0);box-shadow:0 20px 60px rgba(124,77,255,.6);font-size:92px;font-weight:900;display:flex;align-items:center;justify-content:center}
.big{font-size:84px;font-weight:900;text-align:center;width:1080px;line-height:1.12}
.sub{font-size:50px;font-weight:600;color:#cfc7ff;text-align:center;width:1080px}
.conf{position:absolute;width:26px;height:40px;border-radius:6px}
</style></head><body>
<div id="stage">
  <div class="orb" id="o1" style="width:700px;height:700px;background:#6d3df0;left:-200px;top:200px"></div>
  <div class="orb" id="o2" style="width:600px;height:600px;background:#ff8a3d;left:600px;top:1200px;opacity:.28"></div>
  <div class="orb" id="o3" style="width:500px;height:500px;background:#2dd4bf;left:500px;top:-100px;opacity:.22"></div>

  <div class="abs logo" id="logo" style="width:1080px;font-size:230px;top:660px">Word<span>X</span></div>
  <div class="abs" id="tag" style="top:920px">Guess the word from the clues</div>

  <div class="abs" id="card">
    <div class="lab">ROUND 1</div>
    <div id="pts"><b id="ptsN">20</b><i>POINTS</i></div>
    <div id="clues"></div>
    <div class="boxes" id="boxes"></div>
    <div id="inp"><span id="typed"></span></div>
  </div>
  <div id="conf"></div>
  <div class="abs" id="plus" style="top:1500px">+10</div>

  <div class="abs big" id="s3a" style="top:430px">Make a room.<br>Share the code.</div>
  <div class="abs" id="code" style="top:760px">K7QX</div>
  <div id="chips"></div>
  <div class="abs sub" id="s3b" style="top:1400px">Play live with your friends</div>

  <div class="abs big" id="s4a" style="top:520px">Can you guess<br>it in one clue?</div>
  <div class="abs" id="btn" style="top:900px">Play free</div>
  <div class="abs sub" id="s4b" style="top:1180px;color:#ffc928;font-weight:800">Daily prize coming soon</div>
  <div class="abs sub" id="s4c" style="top:1280px">Tap the link to play</div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eb=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const set=(el,o,x=0,y=0,s=1,r=0)=>{el.style.opacity=o;el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`};
const CLUES=['Food','Fried','Made from beans','Nigerian breakfast','Sold with pap'];
const WORD='AKARA';
// build
const clues=$('clues');
const cEls=CLUES.map((c,i)=>{const d=document.createElement('div');d.className='clue hid';d.style.top=(190+i*122)+'px';d.innerHTML=`<div class="n">${i+1}</div><div class="tx">${i<3?'':''}?</div>`;clues.appendChild(d);return d});
// ^ clue 4-5 stay hidden for the whole ad
const boxes=$('boxes');const bEls=[...WORD].map(()=>{const b=document.createElement('div');b.className='box';boxes.appendChild(b);return b});
const chips=$('chips');
const ppl=[['Ade','#7c4dff','85'],['Bola','#ff8a3d','70'],['Chidi','#2dd4bf','55']];
const chEls=ppl.map((p,i)=>{const c=document.createElement('div');c.className='chip';c.style.top=(1000+i*150)+'px';c.style.opacity=0;c.innerHTML=`<div class="av" style="background:${p[1]}">${p[0][0]}</div>${p[0]}<em>${p[2]}</em>`;chips.appendChild(c);return c});
// confetti
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const cols=['#ffc928','#8b5cf6','#4ade80','#ff8a3d','#2dd4bf','#ff5d8f'];
const confs=[];for(let i=0;i<80;i++){const e=document.createElement('div');e.className='conf';e.style.background=cols[i%6];$('conf').appendChild(e);confs.push({e,vx:(rnd()-.5)*1500,vy:-(500+rnd()*1000),r:rnd()*720-360,s:0.6+rnd()*0.8})}
// events
const G1=[3.0,4.2],G2=[5.6,6.9],G3=[8.0,9.3];
const typedAt=(t,start,end,w)=>{const n=Math.round(seg(t,start,end)*w.length);return w.slice(0,n)};
function render(t){
  // background motion
  set($('o1'),.5,Math.sin(t*.8)*60,Math.cos(t*.6)*50);
  set($('o2'),.28,Math.cos(t*.7)*70,Math.sin(t*.9)*60);
  set($('o3'),.22,Math.sin(t*.5)*50,Math.cos(t*.8)*40);

  // scene 1: logo
  const lp=eb(seg(t,0.15,0.95));
  let logoY=0,logoS=1,tagO=1;
  const lm=eo(seg(t,2.0,2.7));
  logoY=-(660-120)*lm; logoS=1-0.55*lm;
  set($('logo'),t<0.15?0:1,0,logoY,t<2.0?lp:logoS);
  tagO=seg(t,0.9,1.4)*(1-seg(t,1.8,2.2));
  set($('tag'),tagO,0,(1-seg(t,0.9,1.4))*30);

  // card
  const cin=eo(seg(t,2.0,2.8));const cout=eo(seg(t,10.0,10.7));
  let shake=0;
  [G1[1],G2[1]].forEach(g=>{const k=t-g;if(k>0&&k<0.5)shake+=Math.sin(k*60)*18*(1-k/0.5)});
  set($('card'),cin*(1-cout),shake,(1-cin)*260+cout*-160,1-0.06*cout);

  // clues state
  const open=[true,t>=G1[1]+0.1,t>=G2[1]+0.1,false,false];
  cEls.forEach((el,i)=>{
    const was=el.classList.contains('hid');
    if(open[i]&&was){el.classList.remove('hid');el.querySelector('.tx').textContent=CLUES[i]}
    if(!open[i]&&!was){el.classList.add('hid');el.querySelector('.tx').textContent='?'}
    const at=[0,G1[1]+0.1,G2[1]+0.1][i];
    if(i<3){const k=seg(t,at,at+0.4);el.style.transform=open[i]?`scale(${1+0.06*Math.sin(k*Math.PI)})`:'none'}
    if(i===0)el.style.transform='none';
  });
  // points
  const p=t<G1[1]+0.1?20:(t<G2[1]+0.1?15:10);
  const pk=[G1[1]+0.1,G2[1]+0.1].map(a=>seg(t,a,a+0.35));
  $('ptsN').textContent=p;
  const pop=Math.max(...pk.map(k=>k>0&&k<1?Math.sin(k*Math.PI):0));
  $('ptsN').style.transform=`scale(${1+0.35*pop})`;
  $('ptsN').style.color=(t>=G3[1]&&t<10.6)?'#4ade80':(pop>0?'#ff6b6b':'#ffc928');

  // typing
  let txt='';
  if(t>=G1[0]&&t<G1[1]+0.45)txt=typedAt(t,G1[0],G1[0]+0.8,'RICE');
  if(t>=G2[0]&&t<G2[1]+0.45)txt=typedAt(t,G2[0],G2[0]+0.8,'DODO');
  if(t>=G3[0]&&t<G3[1]+0.2)txt=typedAt(t,G3[0],G3[0]+1.0,'AKARA');
  $('typed').textContent=txt;
  const wrong=(t>G1[1]&&t<G1[1]+0.5)||(t>G2[1]&&t<G2[1]+0.5);
  const right=t>=G3[1]&&t<G3[1]+0.4;
  $('inp').style.borderColor=wrong?'#ff5d5d':(right?'#4ade80':'rgba(255,255,255,.18)');
  $('typed').style.color=wrong?'#ff8a8a':'#fff';
  if(!txt&&t<G1[0])$('typed').textContent='';

  // letters reveal
  bEls.forEach((b,i)=>{
    const k=seg(t,G3[1]+0.1+i*0.12,G3[1]+0.1+i*0.12+0.3);
    if(k>0){b.textContent=WORD[i];b.style.background='rgba(74,222,128,.25)';b.style.borderColor='#4ade80';b.style.transform=`scale(${1+0.25*Math.sin(k*Math.PI)})`}
    else{b.textContent='';b.style.background='rgba(0,0,0,.28)';b.style.borderColor='rgba(255,255,255,.14)';b.style.transform='none'}
  });

  // +10
  const pl=seg(t,G3[1]+0.2,G3[1]+0.7);
  set($('plus'),pl*(1-seg(t,10.0,10.5)),0,-pl*90,0.6+0.4*eb(pl));

  // confetti
  confs.forEach((c,i)=>{
    const k=t-(G3[1]+0.1);
    if(k<0||k>2.2){c.e.style.opacity=0;return}
    const x=540+c.vx*k;
    const y=900+c.vy*k+1300*k*k;
    c.e.style.opacity=1-seg(k,1.6,2.2);
    c.e.style.transform=`translate(${x}px,${y}px) rotate(${c.r*k}deg) scale(${c.s})`;
  });

  // scene 3
  const s3=eo(seg(t,10.7,11.4))*(1-eo(seg(t,13.0,13.5)));
  set($('s3a'),s3,0,(1-eo(seg(t,10.7,11.4)))*60);
  set($('code'),s3,0,(1-eo(seg(t,11.0,11.7)))*60,1);
  chEls.forEach((c,i)=>{const k=eo(seg(t,11.5+i*0.2,12.1+i*0.2))*(1-eo(seg(t,13.0,13.5)));set(c,k,(1-eo(seg(t,11.5+i*0.2,12.1+i*0.2)))*120,0)});
  set($('s3b'),eo(seg(t,12.2,12.8))*(1-eo(seg(t,13.0,13.5))),0,0);

  // scene 4
  const s4=eo(seg(t,13.4,14.0));
  set($('s4a'),s4,0,(1-s4)*60);
  const pulse=1+0.04*Math.sin(Math.max(0,t-14.0)*7);
  set($('btn'),eo(seg(t,13.7,14.2)),0,(1-eo(seg(t,13.7,14.2)))*60,pulse*(0.85+0.15*eb(seg(t,13.7,14.2))));
  set($('s4b'),eo(seg(t,14.0,14.5)),0,0);
  set($('s4c'),eo(seg(t,14.2,14.7)),0,0);
  // logo at the end: back to top stays small
  if(t>=13.4){}
}
window.render=render;render(0);
</script></body></html>
