services:
  - type: web
    name: wordx
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    # On a deploy, give running games up to 5 minutes (Render's maximum) to finish.
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      # Secrets: you type these in the Render dashboard (they are never stored in GitHub).
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Optional: a different inbox for "Advertise here" messages. Leave empty to use ADMIN_EMAIL.
      - key: CONTACT_EMAIL
        sync: false
      # Prize settings (change if you like).
      # The cash prize is paused until we have sponsors. Set to "on" to switch it back on.
      - key: PRIZE_ACTIVE
        value: "off"
      - key: PRIZE_NAIRA
        value: 1000
      - key: PRIZE_MIN_ROUNDS
        value: 5
      - key: CLAIM_HOURS
        value: 48
      # Word meanings from Wiktionary after each round. Set to "off" to turn them off.
      - key: DICTIONARY
        value: "on"
      # Must match maxShutdownDelaySeconds above. The server stops 5 seconds before this.
      - key: SHUTDOWN_DELAY_SECONDS
        value: 300
